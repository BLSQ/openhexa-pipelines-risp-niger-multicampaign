name: Push "orchestrate pipelines flow" pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/push-orchestrate-pipelines-flow.yml"
      - "orchestrate_pipelines_flow/**"
      - "shared/utils.py"
      - "scripts/sync_shared_utils.py"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync shared_utils.py from canonical source (shared/utils.py)
        run: python3 scripts/sync_shared_utils.py --check

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Configure OpenHEXA CLI
        uses: blsq/openhexa-cli-action@v1
        with:
          workspace: "pev-niger-7cc1fb"
          token: ${{ secrets.OH_TOKEN }}

      - name: Push pipeline to OpenHEXA
        run: |
          openhexa pipelines push orchestrate_pipelines_flow \
            -c multi-campagne-02-orchestrate-etl-pipelines \
            -n ${{ github.sha }} \
            -l "https://github.com/BLSQ/openhexa-pipelines-risp-niger-multicampaign/commit/${{ github.sha }}" \
            --yes
